<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chatroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">Chatroom</div>
  <nav class="rooms" aria-label="Rooms">
    <h2>Rooms</h2>
    <button class="room" aria-current="true" data-room="general">General <span class="badge">3</span></button>
    <button class="room" data-room="study">Study group</button>
    <button class="room" data-room="gaming">Gaming</button>
    <button class="room" data-room="random">Random</button>
  </nav>
  <label class="me">
    Your name
    <input id="username" type="text" maxlength="20" autocomplete="off">
  </label>
</aside>

<main class="chat">
  <header class="chat-header">
    <button class="menu-btn" id="menuBtn" aria-label="Open rooms">Rooms</button>
    <div>
      <h1 id="roomTitle">General</h1>
      <p>4 people online</p>
    </div>
    <span class="online" title="Connected"></span>
  </header>

  <section class="messages" id="messages" aria-live="polite">
    
  </section>

  <div class="typing" id="typing"></div>

  <form class="composer" id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Write a message" aria-label="Message" maxlength="500">
    <button type="submit">Send</button>
  </form>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>

    
    
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const list = document.getElementById('messages');
    const username = document.getElementById('username');
    const title = document.getElementById('roomTitle');
    
    const socket = io();
    socket.on('chat-message', (data) => {
        const mine = data.user === username.value;
        data.mine = mine;
        
        addMessage(data)
    });

    let currentRoom = 'general';

    socket.on('connect', () => {
        socket.emit('join-room', currentRoom)
    });

    // Builds one message and adds it to the screen.
    // Uses textContent (not innerHTML) so nobody can inject HTML through a message.
    function addMessage({ user, text, time, mine }) {
        const wrap = document.createElement('div');
        wrap.className = 'msg new' + (mine ? ' mine' : '');

        if (!mine) {
        const who = document.createElement('span');
        who.className = 'who';
        who.textContent = user;
        wrap.appendChild(who);
        }
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        const stamp = document.createElement('time');
        stamp.textContent = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        wrap.append(bubble, stamp);
        list.appendChild(wrap);
        list.scrollTop = list.scrollHeight;
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        socket.emit('chat-message', {'user': username.value, 'text': text})
        input.value = '';
    });

    // Room switching (visual only for now)
    document.querySelectorAll('.room').forEach((btn) => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.room').forEach((b) => b.removeAttribute('aria-current'));
            btn.setAttribute('aria-current', 'true');
            title.textContent = btn.firstChild.textContent.trim();
            document.body.classList.remove('menu-open');
            currentRoom = btn.dataset.room
            socket.emit('join-room', currentRoom)
            list.replaceChildren();
        });
    });

    document.getElementById('menuBtn').addEventListener('click', () => {
        document.body.classList.toggle('menu-open');
    });

    list.scrollTop = list.scrollHeight;
</script>
</body>
</html>
